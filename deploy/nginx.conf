server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name 39.107.111.115;

    ssl_certificate /etc/letsencrypt/live/airmirror-signaling-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/airmirror-signaling-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:3420;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
