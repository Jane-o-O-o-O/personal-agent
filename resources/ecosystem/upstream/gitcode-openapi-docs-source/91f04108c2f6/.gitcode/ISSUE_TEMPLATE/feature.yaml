name: 新功能或改进建议
description: 对 GitCode 产品提出新的功能需求或改进建议
title: "[Feature]-"
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢你提出功能建议！为了帮助我们更好地理解你的需求，请尽可能提供以下信息

  - type: input
    id: feature_description
    attributes:
      label: 功能简要描述
      placeholder: 请简单描述你想要的功能或改进...

  - type: dropdown
    id: feature_type
    attributes:
      label: 请选择需求需要改进的功能模块
      options:
        - 搜索功能改进
        - 代码功能改进
        - 项目功能改进
        - 组织功能改进
        - 用户功能改进
        - 流水线功能改进
        - OpenAPI功能改进
        - 模型托管功能改进
        - 其它功能建议
      multiple: true
    validations:
      required: true

  - type: input
    id: priority
    attributes:
      label: 建议的优先级
      description: 如果从 1~10 为该功能打分（10代表非常重要），你会给出的打分
      placeholder: 请填写 1~10 的数字...

  - type: textarea
    id: user_story
    attributes:
      label: 功能详细描述
      description: 请描述该功能改进会如何影响你或其他用户，或你希望通过该功能达到的预期目标
      placeholder: 功能详细描述...

  - type: input
    id: demo
    attributes:
      label: 参考示例
      description: 请提供同类型平台上的类似功能参考或功能介绍
      placeholder: 参考的示例地址或说明...