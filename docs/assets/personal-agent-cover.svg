<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="title description">
  <title id="title">Personal Agent — Your AI. Your workspace. Your server.</title>
  <desc id="description">An editorial illustration of a self-hosted personal AI workspace, showing persistent tasks, a native browser and a human approval step. This is a product illustration, not a screenshot.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#d9e3dc" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="155%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#173f2c" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183e30"/>
      <stop offset="1" stop-color="#0f2c21"/>
    </linearGradient>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <rect width="1440" height="680" rx="28" fill="#f5f6ef"/>
    <rect x="0.5" y="0.5" width="1439" height="679" rx="27.5" fill="none" stroke="#dbe4db"/>
    <path d="M708 1V679" stroke="#dce5db"/>
    <rect x="709" y="1" width="730" height="678" rx="27" fill="url(#grid)" opacity="0.46"/>
    <path d="M709 1H1412Q1439 1 1439 28V651Q1439 679 1412 679H709Z" fill="#eff3ec" fill-opacity="0.38"/>

    <g transform="translate(72 66)">
      <rect width="40" height="40" rx="11" fill="#1c523b"/>
      <path d="M12 28V12H20.5C26.6 12 27 20.7 20.5 20.7H16" fill="none" stroke="#e2f3dd" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="28" cy="28" r="2.4" fill="#b8d7a8"/>
      <text x="56" y="17" font-size="13" letter-spacing="2.1" font-weight="600" fill="#476350">PERSONAL AGENT</text>
      <text x="56" y="36" font-size="12" fill="#7b8b7f">A personal workspace, built around you.</text>
    </g>

    <text x="72" y="245" font-size="76" letter-spacing="-3.6" font-weight="650" fill="#173d2a">Personal Agent</text>
    <text x="75" y="302" font-size="28" letter-spacing="-0.6" font-weight="450" fill="#345542">Your AI. Your workspace.</text>
    <text x="75" y="340" font-size="28" letter-spacing="-0.6" font-weight="450" fill="#345542">Your server.</text>
    <path d="M76 380H124" stroke="#70956c" stroke-width="2"/>
    <text x="75" y="421" font-size="17" fill="#667a69">Built on Pi · Designed for everyday life</text>
    <text x="75" y="454" font-size="17" fill="#667a69">Tasks, tools and a browser — in one place.</text>

    <g transform="translate(75 511)" font-size="13" font-weight="550" fill="#345a40">
      <rect width="156" height="38" rx="19" fill="#e4eddf" stroke="#cadbc5"/>
      <circle cx="20" cy="19" r="3" fill="#638a5a"/>
      <text x="32" y="24">Persistent tasks</text>
      <rect x="166" width="145" height="38" rx="19" fill="#e4eddf" stroke="#cadbc5"/>
      <path d="M183 15h9v8h-9zM183 18h9" fill="none" stroke="#638a5a" stroke-width="1.2"/>
      <text x="201" y="24">Native browser</text>
      <rect x="321" width="134" height="38" rx="19" fill="#e4eddf" stroke="#cadbc5"/>
      <path d="m338 16-3 3 3 3m7-6 3 3-3 3m-4-8-2 10" fill="none" stroke="#638a5a" stroke-width="1.2" stroke-linecap="round"/>
      <text x="355" y="24">MCP &amp; APIs</text>
    </g>
    <text x="75" y="611" font-size="12" letter-spacing="1.6" fill="#8a998a">SELF-HOSTED · BROWSER-NATIVE · EXTENSIBLE</text>

    <text x="762" y="102" font-size="11" letter-spacing="2" font-weight="600" fill="#829584">PRODUCT ILLUSTRATION</text>
    <g filter="url(#shadow)">
      <rect x="760" y="126" width="610" height="412" rx="18" fill="url(#panel)"/>
      <rect x="760.5" y="126.5" width="609" height="411" rx="17.5" fill="none" stroke="#4f725c" stroke-opacity="0.65"/>
      <path d="M760 173H1370" stroke="#3d5c48"/>
      <circle cx="784" cy="150" r="4" fill="#8ea793"/>
      <circle cx="799" cy="150" r="4" fill="#5f816b"/>
      <circle cx="814" cy="150" r="4" fill="#3f654e"/>
      <text x="844" y="154" font-size="11" fill="#acc4b0">Your workspace</text>
      <rect x="1240" y="140" width="111" height="21" rx="10.5" fill="#294f3c"/>
      <circle cx="1253" cy="150.5" r="3" fill="#afd494"/>
      <text x="1263" y="154" font-size="10" fill="#bfd5bc">On your server</text>
      <path d="M833 173V538" stroke="#3d5c48"/>
      <rect x="774" y="196" width="45" height="38" rx="8" fill="#365d47"/>
      <g fill="none" stroke="#b4ceb5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M788 207h17v15h-17zM792 211h9M792 216h6"/>
        <rect x="788" y="254" width="17" height="13" rx="2"/>
        <path d="M788 258h17M795 267v4M791 271h11"/>
        <path d="M789 300h15v15h-15zM793 297v6M800 297v6M789 306h15"/>
        <path d="M789 350h15M789 357h15M789 364h15M791 350v14M802 350v14"/>
      </g>
      <circle cx="796.5" cy="507" r="11" fill="#41694f"/>
      <path d="m792 507 3 3 6-6" fill="none" stroke="#d1e5c7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="858" y="210" font-size="10" letter-spacing="1.8" fill="#96b39c">A TASK THAT CAN CONTINUE</text>
      <text x="858" y="242" font-size="24" letter-spacing="-0.4" font-weight="550" fill="#f2f4e8">Plan a day in Hangzhou</text>
      <text x="858" y="266" font-size="12" fill="#a5c0a9">The plan, the browser and your next decision.</text>

      <rect x="857" y="288" width="486" height="55" rx="9" fill="#254b38" stroke="#456b4e"/>
      <circle cx="879" cy="315" r="9" fill="#bad6a7"/>
      <path d="m875 315 3 3 5-6" fill="none" stroke="#23432c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="899" y="312" font-size="13" font-weight="550" fill="#e5efdc">Find the route</text>
      <text x="899" y="330" font-size="10.5" fill="#97b69d">Use available tools to gather the details</text>
      <text x="1291" y="319" font-size="10" fill="#bad6a7">PLAN</text>

      <rect x="857" y="354" width="486" height="76" rx="9" fill="#f3f4e9"/>
      <circle cx="879" cy="378" r="9" fill="#e3dcc0"/>
      <path d="M879 374v5m0 3v.1" fill="none" stroke="#857b41" stroke-width="1.8" stroke-linecap="round"/>
      <text x="899" y="378" font-size="13" font-weight="550" fill="#2f5039">Review the next action</text>
      <text x="899" y="397" font-size="10.5" fill="#7c8f7b">You decide what happens next.</text>
      <rect x="1255" y="370" width="68" height="28" rx="6" fill="#235a3e"/>
      <text x="1268" y="388" font-size="11" font-weight="600" fill="#eef4e8">Approve</text>
      <text x="899" y="417" font-size="9.5" letter-spacing="1" fill="#8b947a">HUMAN APPROVAL</text>

      <rect x="857" y="441" width="486" height="59" rx="9" fill="#1c402e" stroke="#3e6349"/>
      <circle cx="879" cy="470" r="9" fill="#355c43"/>
      <path d="m877 466 6 4-6 4z" fill="#b0cea6"/>
      <text x="899" y="468" font-size="13" font-weight="550" fill="#d7e5cf">Continue when approved</text>
      <text x="899" y="486" font-size="10.5" fill="#8cac93">Resume the task with its context intact</text>
      <path d="M1320 464v10m-4-4h8" stroke="#80a385" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <g transform="translate(793 566)">
      <path d="M0 11h20m-5-5 5 5-5 5" fill="none" stroke="#73916d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="16" font-size="14" fill="#5d7b5c">Observe. Decide. Act. Stay in control.</text>
      <text x="32" y="39" font-size="11" fill="#91a08b">Persistent context · Human handoff · Explicit permissions</text>
    </g>
  </g>
</svg>
